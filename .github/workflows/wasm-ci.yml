      - name: Build WASM package (nodejs target)
        run: |
          set -euo pipefail
          echo "Current working directory:"
          pwd
          ls -la
          
          # Determine correct build directory containing Cargo.toml
          if [ -f "sovereign_governance_wasm/Cargo.toml" ]; then
            cd sovereign_governance_wasm
            echo "Entering sovereign_governance_wasm directory."
          elif [ -f "Cargo.toml" ]; then
            echo "Building from repository root."
          else
            echo "ERROR: Cargo.toml not found anywhere in workspace structure!"
            find . -name "Cargo.toml"
            exit 1
          end

          export npm_config_yes=true
          CI=true wasm-pack build --release --target nodejs --out-dir pkg
          echo "WASM pkg contents:" && ls -la pkg || true

      - name: Run Rust unit tests
        run: |
          set -euo pipefail
          if [ -d "sovereign_governance_wasm" ] && [ ! -f "Cargo.toml" ]; then
            cd sovereign_governance_wasm
          fi
          cargo test --verbose


git add .github/workflows/wasm-ci.yml
git commit -m "CI: fix working directory path resolution for Cargo.toml and src directories"
git push origin update-actions-node24

