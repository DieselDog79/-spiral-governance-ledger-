permissions:
  contents: read

name: Verify Manifest
on:
  push:
    paths:
      - 'manifest.json'
      - 'verify_manifest.sh'
      - '.github/workflows/verify-manifest.yml'
  pull_request:
    paths:
      - 'manifest.json'
      - 'verify_manifest.sh'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Pre-check required artifacts (warning only)
        run: |
          echo "Checking for pubkey.pem and manifest.sig..."
          if [ ! -f pubkey.pem ] || [ ! -f manifest.sig ]; then
            echo "WARNING: pubkey.pem and/or manifest.sig are missing from the repository. Continuing to compute canonical leaf for review."
            ls -la || true
          else
            echo "Found pubkey.pem and manifest.sig"
          fi

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') || 'rfc8785' }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies (pinned)
        run: |
          python -m pip install --upgrade pip
          python -m pip install rfc8785 --no-cache-dir

      - name: Ensure verify script is executable
        run: chmod +x verify_manifest.sh

      - name: Canonicalize manifest (RFC8785)
        run: ./verify_manifest.sh canonicalize manifest.json

      - name: Compute leaf (SHA-256)
        run: ./verify_manifest.sh leaf canonical.json

      - name: Upload verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: manifest-verification
          path: |
            canonical.json
            manifest.leaf.hex

      - name: Verify detached Ed25519 signature (if present)
        run: |
          if [ -f pubkey.pem ] && [ -f manifest.sig ]; then
            ./verify_manifest.sh verify canonical.json
          else
            echo "Skipping signature verification because pubkey.pem or manifest.sig is missing."
          fi

      - name: Compare manifest_digest against computed leaf
        run: |
          calc=$(cat manifest.leaf.hex)
          expected=$(jq -r '.manifest_digest.hex' manifest.json)
          echo "calculated: $calc"
          echo "expected:   $expected"
          if [ "$calc" != "$expected" ]; then
            echo "ERROR: manifest_digest mismatch" >&2
            exit 1
          fi

      - name: Success
        run: echo "Manifest verification (or leaf computation) passed."
