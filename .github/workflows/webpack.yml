      - name: Install and Verify wasm-pack
        run: |
          set -euo pipefail
          WASM_PACK_VERSION="0.15.0"
          
          if command -v wasm-pack >/dev/null 2>&1; then
            echo "wasm-pack already installed:"
            wasm-pack --version
          else
            echo "Installing wasm-pack v${WASM_PACK_VERSION}..."
            cargo install wasm-pack --locked --version "${WASM_PACK_VERSION}"
          fi
          
          wasm-pack --version

      - name: Build WASM Package (NodeJS Target)
        working-directory: ./sovereign_governance_wasm
        run: |
          set -euo pipefail
          # Force non-interactive npm/wasm-pack actions to prevent hanging on webpack-cli prompts
          npm install -y webpack-cli --save-dev || true
          export npm_config_yes=true
          echo "Executing wasm-pack build..."
          CI=true wasm-pack build --release --target nodejs --out-dir pkg
          echo "WASM pkg contents:" && ls -la pkg || true
