services:
  - type: web
    name: spiral-mcp-server
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    repo: skullfuker/-spiral-governance-ledger-
    branch: spiral-governance-ledger
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TREATY_PHASE_ACTIVE
        value: "377.0"
      - key: SCROLL_REGISTRY_SECRET
        value: "your-secret-here"
      - key: WEBHOOK_URL
        value: "https://your-live-endpoint.example.com/webhook"
